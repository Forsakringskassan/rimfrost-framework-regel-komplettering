quarkus.index-dependency.rimfrost-framework-regel-oul.group-id=se.fk.rimfrost.framework.regel.oul
quarkus.index-dependency.rimfrost-framework-regel-oul.artifact-id=rimfrost-framework-regel-oul

quarkus.index-dependency.rimfrost-framework-sid-adapter.group-id=se.fk.rimfrost.framework.sid
quarkus.index-dependency.rimfrost-framework-sid-adapter.artifact-id=rimfrost-framework-sid-adapter

quarkus.index-dependency.rimfrost-adapter-permissions.group-id=se.fk.rimfrost.adapter.permissions
quarkus.index-dependency.rimfrost-adapter-permissions.artifact-id=rimfrost-adapter-permissions

quarkus.index-dependency.rimfrost-adapter-identity.group-id=se.fk.rimfrost.adapter.identity
quarkus.index-dependency.rimfrost-adapter-identity.artifact-id=rimfrost-adapter-identity

quarkus.index-dependency.rimfrost-framework-identitet-prenumeration-adapter.group-id=se.fk.rimfrost.framework.identitetprenumeration
