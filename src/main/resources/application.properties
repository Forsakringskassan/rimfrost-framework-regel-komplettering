quarkus.hibernate-validator.method-validation.allow-overriding-parameter-constraints=true

#Outgoing
mp.messaging.outgoing.regel-responses.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer
mp.messaging.outgoing.regel-responses.connector=smallrye-kafka

# REST setup
sid.api.base-url=http://rimfrost-k8s-sid:8080

# Incoming: IdentitetUppdateradEvent
mp.messaging.incoming.identitet-uppdaterad.connector=smallrye-kafka
mp.messaging.incoming.identitet-uppdaterad.topic=${identitetprenumeration.reply-to-topic}
mp.messaging.incoming.identitet-uppdaterad.value.deserializer=se.fk.rimfrost.framework.regel.komplettering.presentation.kafka.IdentitetUppdateradEventDeserializer